<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2416"/>
      <stop offset="100%" stop-color="#144D2F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Bento Rounded Tile -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle Topographic Contour Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#34A864" stroke-opacity="0.15" stroke-width="4"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#34A864" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="8 8"/>
  
  <!-- Central Emblem Shield -->
  <rect x="136" y="136" width="240" height="240" rx="48" fill="#34A864" filter="url(#shadow)"/>
  
  <!-- Cutlery Cross Icon in Deep Forest Emerald -->
  <g fill="none" stroke="#082515" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Fork -->
    <path d="M210 200v30c0 14-11 25-25 25h0c-14 0-25-11-25-25v-30"/>
    <path d="M160 200v18"/>
    <path d="M185 200v18"/>
    <path d="M210 200v18"/>
    <path d="M185 255v65"/>
    
    <!-- Knife & Spoon Diagonal -->
    <path d="M305 200v120"/>
    <path d="M305 200c18 0 32 14 32 32v24c0 12-10 22-22 22h-10"/>
    
    <!-- Electric MoMo Bolt Accent -->
    <path d="M256 180l-16 40h24l-8 44 28-52h-22z" fill="#082515"/>
  </g>
  
  <!-- Footer Brand Label -->
  <text x="256" y="440" text-anchor="middle" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="4">BOMAPOS</text>
</svg>
